<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">FARVEXA — Software, AI, Systems</title>
  <desc id="desc">A dark architectural grid with cyan system lines and the FARVEXA brand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.55" stop-color="#080d15"/>
      <stop offset="1" stop-color="#07131a"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="48%" r="52%">
      <stop offset="0" stop-color="#00e0d1" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#00e0d1" stop-opacity=".04"/>
      <stop offset="1" stop-color="#00e0d1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e6eaf1" stroke-opacity=".045"/>
    </pattern>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="20" fill="url(#glow)"/>

  <g transform="translate(58 52)">
    <path d="M0 0h168" stroke="#00e0d1" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#00e0d1" filter="url(#cyanGlow)"/>
    <text x="184" y="5" fill="#00e0d1" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">FVX / CORE</text>
  </g>

  <g transform="translate(58 126)">
    <text fill="#e6eaf1" font-family="'Space Grotesk',Inter,Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="9">FARVEXA</text>
    <text y="46" fill="#00e0d1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="6">SOFTWARE • AI • SYSTEMS</text>
    <text y="122" fill="#98a5b7" font-family="Inter,Arial,sans-serif" font-size="21" letter-spacing=".6">Custom software and secure systems built around real operations.</text>
    <text y="162" fill="#e6eaf1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="3">INTELLIGENCE, ENGINEERED.</text>
  </g>

  <g transform="translate(836 72)" fill="none">
    <circle cx="122" cy="122" r="108" stroke="#00e0d1" stroke-opacity=".20"/>
    <circle cx="122" cy="122" r="75" stroke="#00e0d1" stroke-opacity=".10"/>
    <path d="M14 122h216M122 14v216M46 46l152 152M198 46L46 198" stroke="#00e0d1" stroke-opacity=".12"/>
    <rect x="72" y="72" width="100" height="100" stroke="#e6eaf1" stroke-opacity=".16"/>
    <path d="M98 94h48l-24 48z" stroke="#00e0d1" stroke-width="3"/>
    <path d="M108 109h28l-14 20z" fill="#00e0d1" fill-opacity=".14" stroke="#00e0d1"/>
    <circle cx="122" cy="14" r="4" fill="#00e0d1" filter="url(#cyanGlow)"/>
    <circle cx="230" cy="122" r="4" fill="#00e0d1"/>
    <circle cx="46" cy="198" r="3" fill="#00e0d1"/>
  </g>

  <g transform="translate(1040 320)" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="2">
    <text fill="#98a5b7">SYSTEMS</text>
    <text x="72" fill="#00e0d1">ONLINE</text>
  </g>
  <path d="M0 378h1200" stroke="#00e0d1" stroke-opacity=".55" stroke-width="2"/>
</svg>
